name: Video vụ án

# One issue "[Vụ án] …" = one vertical true-crime short (the channel's language: prompts/channel.json) laid out as
# the owner's sample (00-video-mau/MAU-VU-AN.mp4): a case file on a dark desk, evidence laid down as the voice
# names it, small white subtitles. Owner opens the issue → Claude writes crime/<N>/script.json → this workflow reads the voice
# (11labs, one job per line), checks it with Whisper, searches free pictures and makes the AI illustrations Claude
# asked for → Claude chooses the pictures (crime/<N>/picks.json) → this workflow renders → Claude checks every
# scene → done. An owner comment → Claude fixes. Claude's side: AGENT_CRIME.md. Files: renders branch, crime/<N>/.
on:
  issues:
    types: [opened]
  issue_comment:
    types: [created]
  push:
    branches: [main]
    paths: ['crime/**']
  workflow_dispatch:
    inputs:
      issue:
        description: Số phiếu
        required: true
      steps:
        description: 'Bước: prepare (giọng + ảnh), search (tìm thêm ảnh), render (dựng), caption (chỉ đưa lời đăng lên) — cách nhau bằng dấu cách'
        default: render

# least privilege: each job asks for what it needs (only `work` writes to the repository, on the renders branch)
permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # 1) The owner (or a collaborator) opens a [Vụ án] issue → wait for Claude's plan, wake Claude now
  start:
    if: >-
      github.event_name == 'issues' && startsWith(github.event.issue.title, '[Vụ án]')
      && contains(fromJson('["OWNER","MEMBER","COLLABORATOR"]'), github.event.issue.author_association)
    runs-on: ubuntu-24.04
    permissions:
      contents: read   # checkout of scripts/
      issues: write    # labels and comments
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false, sparse-checkout: scripts }
      # Claude is called first: the comment only promises Claude's steps when the call went through (or a Claude chat
      # holds the issue with crime-busy); when it failed, wake_claude.sh has already told the owner what to do.
      - name: Nhận phiếu, gọi Claude
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          N: ${{ github.event.issue.number }}
          CLAUDE_TASK_URL: ${{ secrets.CLAUDE_TASK_URL }}
          CLAUDE_TASK_TOKEN: ${{ secrets.CLAUDE_TASK_TOKEN }}
          HAS_VOICE_KEY: ${{ secrets.VN11_API_KEY != '' || secrets.VOICE != '' }}
        run: |
          gh issue edit "$N" --add-label crime,crime-plan
          # told at once, not after Claude's first step: without this key the voice step can only fail
          if [ "$HAS_VOICE_KEY" != true ]; then
            gh issue comment "$N" --body "🤖 Repo này **chưa có khóa giọng đọc** nên máy chưa tạo được giọng cho video. Cách thêm: Settings → Secrets and variables → Actions → New repository secret, tên \`VN11_API_KEY\`, giá trị là khóa giọng đọc (cùng khóa như các repo khác). Thêm xong thì viết một bình luận ở đây (ví dụ \"đã thêm khóa\") để làm tiếp."
          fi
          bash scripts/wake_claude.sh "Phiếu vụ án mới số $N." "$N"
          if [ "$(cat /tmp/wake_result 2>/dev/null)" != failed ]; then
            gh issue comment "$N" --body "🤖 Đã nhận kịch bản. Claude chia lời (dịch nếu cần) và chọn từ khóa tìm ảnh, máy tạo giọng đọc, tìm ảnh thật và tạo ảnh minh họa, Claude xem và chọn ảnh, máy dựng video, Claude kiểm tra lại từng cảnh. Mỗi bước xong sẽ báo ở đây."
          fi

  # 2) The owner comments on a crime issue → Claude reads it and fixes
  fix:
    if: >-
      github.event_name == 'issue_comment' && github.event.issue.state == 'open'
      && contains(github.event.issue.labels.*.name, 'crime')
      && github.event.comment.user.type != 'Bot'
      && contains(fromJson('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)
      && !startsWith(github.event.comment.body, '🤖')
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false, sparse-checkout: scripts }
      - name: Nhận yêu cầu sửa, gọi Claude
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          N: ${{ github.event.issue.number }}
          CLAUDE_TASK_URL: ${{ secrets.CLAUDE_TASK_URL }}
          CLAUDE_TASK_TOKEN: ${{ secrets.CLAUDE_TASK_TOKEN }}
        run: |
          gh issue edit "$N" --add-label crime-fix --remove-label crime-done || true
          bash scripts/wake_claude.sh "Chủ kênh yêu cầu sửa phiếu vụ án số $N." "$N"
          if [ "$(cat /tmp/wake_result 2>/dev/null)" != failed ]; then
            gh issue comment "$N" --body "🤖 Đã nhận yêu cầu. Claude sẽ sửa và máy dựng lại."
          fi

  # 3) Claude pushed crime/<N>/… (or a manual run) → voice + pictures, or the video
  work:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 270   # up to 2 hours of waiting for earlier runs (step "Chờ lượt máy trước xong") + the work
    permissions:
      contents: write   # the renders branch
      issues: write     # labels and comments
      actions: read     # the list of runs, to wait for earlier ones
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      VN11_API_KEY: ${{ secrets.VN11_API_KEY || secrets.VOICE }}   # the owner saved the key as VOICE in the German repo (14/11/2026)
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
      CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      CLAUDE_TASK_URL: ${{ secrets.CLAUDE_TASK_URL }}
      CLAUDE_TASK_TOKEN: ${{ secrets.CLAUDE_TASK_TOKEN }}
      FONTSOURCE: /tmp/fontsource
      PYTHONUNBUFFERED: '1'
      BEFORE: ${{ github.event.before }}
      IN_ISSUE: ${{ inputs.issue }}
      IN_STEPS: ${{ inputs.steps }}
    steps:
      - uses: actions/checkout@v4
      - name: Việc cần làm
        run: |
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            case "$IN_ISSUE" in ''|*[!0-9]*) echo "::error::số phiếu không hợp lệ"; exit 1;; esac
            S=""; for s in $IN_STEPS; do case "$s" in prepare|search|render|caption) S="$S $s";; esac; done
            echo "$IN_ISSUE$S" > /tmp/todo.txt
          else
            # files changed by this push (only the last commit's when the old head cannot be fetched); NUL-separated
            # and unquoted, so names with spaces or accents survive
            { git fetch -q --depth 1 origin "$BEFORE" 2>/dev/null && git -c core.quotePath=false diff -z --name-only "$BEFORE" HEAD -- crime/ > /tmp/files.txt; } \
              || git -c core.quotePath=false show -z --name-only --format= HEAD -- crime/ > /tmp/files.txt
            python3 -c '
          import re, sys, collections
          todo = collections.OrderedDict()
          for f in sys.stdin.buffer.read().decode("utf-8", "replace").split("\0"):
              m = re.match(r"crime/(\d+)/(.+)$", f.strip("\n"))
              if not m: continue
              n, rest = m.groups()
              s = todo.setdefault(n, [])
              step = "prepare" if rest == "script.json" else "search" if re.match(r"search-\w+\.json$", rest) else "render" if rest == "picks.json" or rest.startswith("own/") else "caption" if rest == "caption.txt" else None
              if step and step not in s: s.append(step)
          order = ["prepare", "search", "render", "caption"]
          print("\n".join(n + " " + " ".join(sorted(s, key=order.index)) for n, s in todo.items() if s))' < /tmp/files.txt > /tmp/todo.txt
          fi
          cat /tmp/todo.txt
          [ -s /tmp/todo.txt ] && echo "TODO=1" >> "$GITHUB_ENV" || echo "Không có việc."
      # One machine run at a time: runs of this workflow that started before this one finish first, so a picks.json
      # pushed while a search or the voice step is still running renders with that step's pictures and voice, and two
      # runs never move the labels of one issue at the same time. Not a `concurrency:` group: GitHub keeps only one
      # waiting run per group (a third push would drop the second), and the issue number is not known before the
      # job starts, so a group per issue cannot be written.
      - name: Chờ lượt máy trước xong
        if: env.TODO == '1'
        timeout-minutes: 125
        run: |
          ERR=0
          for i in $(seq 1 220); do   # at most ~2 hours, then run anyway: an earlier run that hangs must not block for ever
            B=$(gh api "repos/$GH_REPO/actions/workflows/crime.yml/runs?per_page=50" --jq "[.workflow_runs[] | select(.status != \"completed\" and .run_number < $GITHUB_RUN_NUMBER and (.event == \"push\" or .event == \"workflow_dispatch\"))] | length") || B=err
            if [ "$B" = 0 ]; then break; fi
            if [ "$B" = err ]; then
              ERR=$((ERR + 1))
              if [ "$ERR" -ge 5 ]; then echo "::warning::không đọc được danh sách lượt chạy, chạy tiếp"; break; fi
            else
              ERR=0; echo "còn $B lượt máy bắt đầu trước đang chạy, chờ…"
            fi
            sleep 30
          done
      # the picture search ranks its results with CLIP (scripts/find_images.py): the model file (600 MB) is kept between runs
      - name: Mô hình chấm điểm ảnh
        if: env.TODO == '1'
        uses: actions/cache@v4
        with:
          path: ~/.cache/find-images
          key: clip-vit-b-32-quickgelu-laion400m-e32
      # the depth model of the picture effects (scripts/crime/depth.py, 99 MB) is kept between runs
      - name: Mô hình chiều sâu ảnh
        if: env.TODO == '1'
        uses: actions/cache@v4
        with:
          path: ~/.cache/crime-depth
          key: depth-anything-v2-vits-onnx
      - name: Cài công cụ
        if: env.TODO == '1'
        run: |
          # picture ranking, only for the steps that search; optional: without it the search keeps the first pictures of every archive
          if grep -qE ' (prepare|search)' /tmp/todo.txt; then
            { pip install -q torch torchvision --index-url https://download.pytorch.org/whl/cpu && pip install -q open_clip_torch; } \
              || echo "::warning::không cài được bộ chấm điểm ảnh: tìm ảnh chạy không xếp hạng"
          fi
          # pinned to the versions tested together (PyAV 19 breaks faster-whisper 1.2: "metadata_errors")
          pip install -q numpy scipy pillow pykakasi==2.3.0 num2words==0.5.14 faster-whisper==1.1.1 av==13.1.0 imageio-ffmpeg==0.8.1
          # picture effects (owner 18/11/2026): optional, without them the pictures stay flat and the video is made all the same
          if grep -q ' render' /tmp/todo.txt; then
            pip install -q onnxruntime==1.29.0 opencv-python-headless==5.0.0.93 \
              && python -c "import sys; sys.path.insert(0, 'scripts/crime'); import depth; depth.session()" \
              || echo "::warning::không cài được hiệu ứng chiều sâu: ảnh sẽ phẳng như cũ"
          fi
          npm ci --no-audit --no-fund
          npx remotion browser ensure
          bash scripts/crime/get_fonts.sh "$FONTSOURCE"
      - name: Chạy
        if: env.TODO == '1'
        run: |
          FAIL=0
          : > /tmp/handled.txt
          while read -r N STEPS; do
            echo "::group::phiếu #$N: $STEPS"
            # < /dev/null: nothing inside run.py may read the rest of the to-do list from the loop's stdin
            RC=0; python3 scripts/crime/run.py "$N" $STEPS < /dev/null || RC=$?
            if [ "$RC" = 3 ]; then
              # run.py stopped before doing anything and told the owner why on the issue (a missing key, files cleaned
              # up): nothing for Claude to repair, so no call and no second comment
              FAIL=1
              gh issue edit "$N" --add-label crime-failed < /dev/null || true
            elif [ "$RC" != 0 ]; then
              FAIL=1
              gh issue edit "$N" --add-label crime-failed --remove-label crime-voice --remove-label crime-render < /dev/null || true
              bash scripts/wake_claude.sh "Phiếu vụ án số $N bị lỗi ở bước $STEPS." "$N" < /dev/null || true
              CLAUDE=" Claude sẽ xem và sửa."; [ "$(cat /tmp/wake_result 2>/dev/null)" != failed ] || CLAUDE=""   # no promise when Claude could not be called
              gh issue comment "$N" --body "🤖 Máy gặp lỗi ở bước \`$STEPS\` — xem nhật ký: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID .$CLAUDE" < /dev/null || true
            fi
            echo "$N" >> /tmp/handled.txt
            echo "::endgroup::"
          done < /tmp/todo.txt
          exit $FAIL
      # The job stopped outside run.py (tools failed to install, time limit, cancelled): issues the loop did not reach
      # would keep crime-voice/crime-render forever, so they are marked failed here.
      - name: Báo lỗi cho phiếu chưa chạy
        if: (failure() || cancelled()) && env.TODO == '1'
        run: |
          touch /tmp/handled.txt
          while read -r N STEPS; do
            [ -n "$N" ] || continue
            grep -qx "$N" /tmp/handled.txt && continue
            gh issue edit "$N" --add-label crime-failed < /dev/null || true
            gh issue edit "$N" --remove-label crime-voice --remove-label crime-render < /dev/null || true
            bash scripts/wake_claude.sh "Phiếu vụ án số $N: máy dừng giữa chừng ở bước $STEPS." "$N" < /dev/null || true
            CLAUDE=" Claude sẽ xem và chạy lại."; [ "$(cat /tmp/wake_result 2>/dev/null)" != failed ] || CLAUDE=""
            gh issue comment "$N" --body "🤖 Máy dừng giữa chừng trước khi làm xong bước \`$STEPS\` (lỗi cài đặt, quá giờ hoặc bị hủy) — xem nhật ký: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID .$CLAUDE" < /dev/null || true
          done < /tmp/todo.txt
          true
