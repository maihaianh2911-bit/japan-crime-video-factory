name: Video vụ án

# One issue "[Vụ án] …" = one vertical true-crime short (the channel's language: prompts/channel.json) laid out as
# the owner's sample (00-video-mau/MAU-VU-AN.mp4): a case file on a dark desk, evidence laid down as the voice
# names it, small white subtitles. Owner opens the issue → Claude writes crime/<N>/script.json → this workflow reads the voice
# (11labs, one job per line), checks it with Whisper, searches free pictures and makes the AI illustrations Claude
# asked for → Claude chooses the pictures (crime/<N>/picks.json) → this workflow renders → Claude checks every
# scene → done. An owner comment → Claude fixes. Claude's side: AGENT_CRIME.md. Files: renders branch, crime/<N>/.
on:
  issues:
    types: [opened]
  issue_comment:
    types: [created]
  push:
    branches: [main]
    paths: ['crime/**']
  workflow_dispatch:
    inputs:
      issue:
        description: Số phiếu
        required: true
      steps:
        description: 'Bước: prepare (giọng + ảnh), search (tìm thêm ảnh), render (dựng) — cách nhau bằng dấu cách'
        default: render

permissions:
  contents: write
  issues: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # 1) The owner (or a collaborator) opens a [Vụ án] issue → wait for Claude's plan, wake Claude now
  start:
    if: >-
      github.event_name == 'issues' && startsWith(github.event.issue.title, '[Vụ án]')
      && contains(fromJson('["OWNER","MEMBER","COLLABORATOR"]'), github.event.issue.author_association)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false, sparse-checkout: scripts }
      # Claude is called first: the comment only promises Claude's steps when the call went through (or a Claude chat
      # holds the issue with crime-busy); when it failed, wake_claude.sh has already told the owner what to do.
      - name: Nhận phiếu, gọi Claude
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          N: ${{ github.event.issue.number }}
          CLAUDE_TASK_URL: ${{ secrets.CLAUDE_TASK_URL }}
          CLAUDE_TASK_TOKEN: ${{ secrets.CLAUDE_TASK_TOKEN }}
        run: |
          gh issue edit "$N" --add-label crime,crime-plan
          bash scripts/wake_claude.sh "Phiếu vụ án mới số $N." "$N"
          if [ "$(cat /tmp/wake_result 2>/dev/null)" != failed ]; then
            gh issue comment "$N" --body "🤖 Đã nhận kịch bản. Claude chia lời (dịch nếu cần) và chọn từ khóa tìm ảnh, máy tạo giọng đọc, tìm ảnh thật và tạo ảnh minh họa, Claude xem và chọn ảnh, máy dựng video, Claude kiểm tra lại từng cảnh. Mỗi bước xong sẽ báo ở đây."
          fi

  # 2) The owner comments on a crime issue → Claude reads it and fixes
  fix:
    if: >-
      github.event_name == 'issue_comment' && github.event.issue.state == 'open'
      && contains(github.event.issue.labels.*.name, 'crime')
      && github.event.comment.user.type != 'Bot'
      && contains(fromJson('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)
      && !startsWith(github.event.comment.body, '🤖')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false, sparse-checkout: scripts }
      - name: Nhận yêu cầu sửa, gọi Claude
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          N: ${{ github.event.issue.number }}
          CLAUDE_TASK_URL: ${{ secrets.CLAUDE_TASK_URL }}
          CLAUDE_TASK_TOKEN: ${{ secrets.CLAUDE_TASK_TOKEN }}
        run: |
          gh issue edit "$N" --add-label crime-fix --remove-label crime-done || true
          bash scripts/wake_claude.sh "Chủ kênh yêu cầu sửa phiếu vụ án số $N." "$N"
          if [ "$(cat /tmp/wake_result 2>/dev/null)" != failed ]; then
            gh issue comment "$N" --body "🤖 Đã nhận yêu cầu. Claude sẽ sửa và máy dựng lại."
          fi

  # 3) Claude pushed crime/<N>/… (or a manual run) → voice + pictures, or the video
  work:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 150   # no concurrency group: a pending run would be dropped when a third push arrives
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      VN11_API_KEY: ${{ secrets.VN11_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
      CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      CLAUDE_TASK_URL: ${{ secrets.CLAUDE_TASK_URL }}
      CLAUDE_TASK_TOKEN: ${{ secrets.CLAUDE_TASK_TOKEN }}
      FONTSOURCE: /tmp/fontsource
      PYTHONUNBUFFERED: '1'
      BEFORE: ${{ github.event.before }}
      IN_ISSUE: ${{ inputs.issue }}
      IN_STEPS: ${{ inputs.steps }}
    steps:
      - uses: actions/checkout@v4
      - name: Việc cần làm
        run: |
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            case "$IN_ISSUE" in ''|*[!0-9]*) echo "::error::số phiếu không hợp lệ"; exit 1;; esac
            S=""; for s in $IN_STEPS; do case "$s" in prepare|search|render) S="$S $s";; esac; done
            echo "$IN_ISSUE$S" > /tmp/todo.txt
          else
            # files changed by this push (only the last commit's when the old head cannot be fetched); NUL-separated
            # and unquoted, so names with spaces or accents survive
            { git fetch -q --depth 1 origin "$BEFORE" 2>/dev/null && git -c core.quotePath=false diff -z --name-only "$BEFORE" HEAD -- crime/ > /tmp/files.txt; } \
              || git -c core.quotePath=false show -z --name-only --format= HEAD -- crime/ > /tmp/files.txt
            python3 -c '
          import re, sys, collections
          todo = collections.OrderedDict()
          for f in sys.stdin.buffer.read().decode("utf-8", "replace").split("\0"):
              m = re.match(r"crime/(\d+)/(.+)$", f.strip("\n"))
              if not m: continue
              n, rest = m.groups()
              s = todo.setdefault(n, [])
              step = "prepare" if rest == "script.json" else "search" if re.match(r"search-\w+\.json$", rest) else "render" if rest == "picks.json" or rest.startswith("own/") else None
              if step and step not in s: s.append(step)
          order = ["prepare", "search", "render"]
          print("\n".join(n + " " + " ".join(sorted(s, key=order.index)) for n, s in todo.items() if s))' < /tmp/files.txt > /tmp/todo.txt
          fi
          cat /tmp/todo.txt
          [ -s /tmp/todo.txt ] && echo "TODO=1" >> "$GITHUB_ENV" || echo "Không có việc."
      - name: Cài công cụ
        if: env.TODO == '1'
        run: |
          # pinned to the versions tested together (PyAV 19 breaks faster-whisper 1.2: "metadata_errors")
          pip install -q numpy scipy pillow pykakasi==2.3.0 num2words==0.5.14 faster-whisper==1.1.1 av==13.1.0 imageio-ffmpeg==0.8.1
          npm ci --no-audit --no-fund
          npx remotion browser ensure
          bash scripts/crime/get_fonts.sh "$FONTSOURCE"
      - name: Chạy
        if: env.TODO == '1'
        run: |
          FAIL=0
          : > /tmp/handled.txt
          while read -r N STEPS; do
            echo "::group::phiếu #$N: $STEPS"
            # < /dev/null: nothing inside run.py may read the rest of the to-do list from the loop's stdin
            if ! python3 scripts/crime/run.py "$N" $STEPS < /dev/null; then
              FAIL=1
              gh issue edit "$N" --add-label crime-failed --remove-label crime-voice --remove-label crime-render < /dev/null || true
              bash scripts/wake_claude.sh "Phiếu vụ án số $N bị lỗi ở bước $STEPS." "$N" < /dev/null || true
              CLAUDE=" Claude sẽ xem và sửa."; [ "$(cat /tmp/wake_result 2>/dev/null)" != failed ] || CLAUDE=""   # no promise when Claude could not be called
              gh issue comment "$N" --body "🤖 Máy gặp lỗi ở bước \`$STEPS\` — xem nhật ký: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID .$CLAUDE" < /dev/null || true
            fi
            echo "$N" >> /tmp/handled.txt
            echo "::endgroup::"
          done < /tmp/todo.txt
          exit $FAIL
      # The job stopped outside run.py (tools failed to install, time limit, cancelled): issues the loop did not reach
      # would keep crime-voice/crime-render forever, so they are marked failed here.
      - name: Báo lỗi cho phiếu chưa chạy
        if: (failure() || cancelled()) && env.TODO == '1'
        run: |
          touch /tmp/handled.txt
          while read -r N STEPS; do
            [ -n "$N" ] || continue
            grep -qx "$N" /tmp/handled.txt && continue
            gh issue edit "$N" --add-label crime-failed < /dev/null || true
            gh issue edit "$N" --remove-label crime-voice --remove-label crime-render < /dev/null || true
            bash scripts/wake_claude.sh "Phiếu vụ án số $N: máy dừng giữa chừng ở bước $STEPS." "$N" < /dev/null || true
            CLAUDE=" Claude sẽ xem và chạy lại."; [ "$(cat /tmp/wake_result 2>/dev/null)" != failed ] || CLAUDE=""
            gh issue comment "$N" --body "🤖 Máy dừng giữa chừng trước khi làm xong bước \`$STEPS\` (lỗi cài đặt, quá giờ hoặc bị hủy) — xem nhật ký: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID .$CLAUDE" < /dev/null || true
          done < /tmp/todo.txt
          true
